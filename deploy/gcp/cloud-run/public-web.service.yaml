apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: gigabyte-cashback-web
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: asia-east1-docker.pkg.dev/side-project-platform/gigabyte-cashback/public-web:REPLACE_TAG
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 256Mi

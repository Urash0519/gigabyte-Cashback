apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: cashback-uat
  labels:
    app: gigabyte-cashback
    environment: uat
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cloudsql-instances: side-project-platform:asia-east1:cashback-uat-db
        run.googleapis.com/container-dependencies: '{"gateway":["api"]}'
        run.googleapis.com/startup-cpu-boost: "false"
    spec:
      serviceAccountName: cashback-uat@side-project-platform.iam.gserviceaccount.com
      containerConcurrency: 10
      timeoutSeconds: 300
      containers:
        - name: gateway
          image: asia-east1-docker.pkg.dev/side-project-platform/cashback-uat/gateway:uat-20260910-q1-p0-final
          ports:
            - containerPort: 8080
          resources:
            limits: {cpu: "1", memory: 256Mi}
        - name: api
          image: asia-east1-docker.pkg.dev/side-project-platform/cashback-uat/api:uat-20260910-q1-p0
          resources:
            limits: {cpu: "1", memory: 1Gi}
          startupProbe:
            httpGet: {path: /health, port: 8081}
            periodSeconds: 5
            failureThreshold: 48
            timeoutSeconds: 3
          env:
            - {name: ASPNETCORE_ENVIRONMENT, value: Development}
            - {name: ASPNETCORE_URLS, value: 'http://+:8081'}
            - {name: ASPNETCORE_FORWARDEDHEADERS_ENABLED, value: 'true'}
            - {name: DevelopmentAuth__Enabled, value: 'true'}
            - {name: Foundation__AllowVerificationActions, value: 'false'}
            - {name: App__SelfUrl, value: 'https://cashback-uat-219894818230.asia-east1.run.app'}
            - {name: App__ClientUrl, value: 'https://cashback-uat-219894818230.asia-east1.run.app'}
            - {name: App__CorsOrigins, value: 'https://cashback-uat-219894818230.asia-east1.run.app'}
            - {name: AuthServer__Authority, value: 'https://cashback-uat-219894818230.asia-east1.run.app'}
            - {name: BlobStorage__Provider, value: Google}
            - {name: BlobStorage__Google__ProjectId, value: side-project-platform}
            - {name: BlobStorage__Google__BucketName, value: side-project-platform-cashback-uat-evidence}
            - {name: DataProtection__KeyPath, value: /app/keys}
            - name: ConnectionStrings__Default
              valueFrom:
                secretKeyRef: {name: cashback-uat-db, key: '1'}
            - name: StringEncryption__DefaultPassPhrase
              valueFrom:
                secretKeyRef: {name: cashback-uat-encryption, key: '1'}
          volumeMounts:
            - {name: keys, mountPath: /app/keys}
      volumes:
        - name: keys
          csi:
            driver: gcsfuse.run.googleapis.com
            readOnly: false
            volumeAttributes:
              bucketName: side-project-platform-cashback-uat-keys

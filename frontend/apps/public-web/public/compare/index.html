<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GIGABYTE Cashback · 版本比較</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f6f7f8;color:#17242d;font:16px/1.65 Arial,"Microsoft JhengHei",sans-serif}header{padding:26px 6vw;background:#151d28;color:white;font-size:25px;font-weight:700}main{max-width:1040px;margin:64px auto;padding:0 24px}h1{font-size:32px;margin:0 0 12px}p{color:#52616c}.versions{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:36px}section{background:white;border:1px solid #dce1e5;padding:28px;border-top:5px solid #ff8500}section.admin{border-top-color:#12a1b1}h2{margin:0 0 10px;font-size:24px}a{display:block;padding:14px 18px;margin:12px 0;border:1px solid #cdd4da;border-radius:4px;color:#17242d;text-decoration:none;font-weight:700}a:hover{background:#eef1f3}a:focus-visible{outline:3px solid #087e8b;outline-offset:3px}.reference{background:#151d28;color:white}.reference:hover{background:#283344}small{display:block;color:#61717c}footer{margin-top:30px;color:#61717c;font-size:14px}@media(max-width:640px){main{margin-top:36px}.versions{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>GIGABYTE <span style="font-size:15px;font-weight:400">Cashback</span></header>
  <main>
    <h1>版本比較</h1>
    <p>現行版本與使用者提供的頁面樣式分別保留獨立入口，可開啟兩個分頁並排比較。兩個版本共用目前的活動與案件資料。</p>
    <div class="versions">
      <section>
        <h2>活動前台</h2>
        <p>瀏覽活動、申請 Cashback、查詢案件與補件。</p>
        <a href="/" target="_blank" rel="noopener">開啟現行前台 ↗</a>
        <a class="reference" href="/reference/" target="_blank" rel="noopener">開啟使用者樣式前台 ↗</a>
        <small>依 Q1 活動入口、國旗頁、活動頁、申請表及追蹤／FAQ 參考呈現。</small>
      </section>
      <section class="admin">
        <h2>營運後台</h2>
        <p>管理活動、審核案件、查看付款與統計報表。</p>
        <a href="/admin/" target="_blank" rel="noopener">開啟現行後台 ↗</a>
        <a class="reference" href="/admin/reference/" target="_blank" rel="noopener">開啟使用者樣式後台 ↗</a>
        <small>依 Benamic 活動列表、深色側欄、統計卡片與摘要報表參考呈現。</small>
      </section>
    </div>
    <footer>UAT 測試環境。操作共用資料時，修改會反映到兩個版本。</footer>
  </main>
</body>
</html>
